name: build

# Verifies the full local flow — install → setup_ffmpeg → build → build_tools →
# benchmark — on Linux and Windows (MinGW64), so platform breakage is caught in
# CI instead of by hand. GitHub sets CI=true automatically, which makes the
# makefiles skip profiler/report-only tooling (VTune, perf, Python venv).
#
# A third job builds the native-MSVC path (makefile.msvc). It is EXPERIMENTAL:
# non-blocking (continue-on-error) and skipped on pull_request to save Windows
# minutes. Flip both once it goes green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUDO: sudo
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # PAT with read access to the private ffmpeg submodule repos; the
          # default GITHUB_TOKEN can only read this repo.
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: FFmpeg submodule revision
        id: ff
        run: echo "sha=$(git -C ffmpeg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The two FFmpeg builds are the slow part; cache the prefixes keyed on the
      # submodule revision so `setup_ffmpeg` is incremental on a cache hit.
      - name: Cache built FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            ffmpeg/FFmpeg-8.0
            ffmpeg/FFmpeg-8.0-custom
          key: ${{ runner.os }}-ffmpeg-${{ steps.ff.outputs.sha }}-${{ hashFiles('makefile') }}

      - name: apt update
        run: sudo apt-get update

      - name: make install
        run: make install

      - name: make setup_ffmpeg
        run: make setup_ffmpeg

      - name: make build
        run: make build

      - name: make build_tools
        run: make build_tools

      - name: make test
        run: make test

      # STEPS=2 runs the extraction pass non-interactively (smoke-test sizing).
      - name: make benchmark
        run: make benchmark STEPS=2 STREAMS=2 NRUNS=1

  windows:
    name: windows (msys2/mingw64)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # FFmpeg's configure/build scripts must keep LF endings; the Windows
      # runner defaults to autocrlf=true which would corrupt them.
      - name: Configure git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # PAT with read access to the private ffmpeg submodule repos; the
          # default GITHUB_TOKEN can only read this repo.
          token: ${{ secrets.SUBMODULES_PAT }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make git patch diffutils base-devel

      - name: FFmpeg submodule revision
        id: ff
        run: echo "sha=$(git -C ffmpeg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache built FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            ffmpeg/FFmpeg-8.0
            ffmpeg/FFmpeg-8.0-custom
          key: ${{ runner.os }}-ffmpeg-${{ steps.ff.outputs.sha }}-${{ hashFiles('makefile.windows') }}

      - name: make install
        run: make -f makefile.windows install

      - name: make setup_ffmpeg
        run: make -f makefile.windows setup_ffmpeg

      - name: make build
        run: make -f makefile.windows build

      - name: make build_tools
        run: make -f makefile.windows build_tools

      - name: make test
        run: make -f makefile.windows test

      - name: make benchmark
        run: make -f makefile.windows benchmark STEPS=2 STREAMS=2 NRUNS=1

  windows-msvc:
    name: windows (msvc, experimental)
    runs-on: windows-latest
    # Untested end-to-end: keep non-blocking so it's exercised without gating the
    # build, and skip it on PRs to save Windows minutes. Remove both once green.
    continue-on-error: true
    if: github.event_name != 'pull_request'
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    env:
      # windows-latest ships LLVM here; ffmpeg-sys-next's bindgen needs libclang.
      # VERIFY: adjust if the runner image relocates LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      # FFmpeg's configure/build scripts must keep LF endings.
      - name: Configure git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # PAT with read access to the private ffmpeg submodule repos.
          token: ${{ secrets.SUBMODULES_PAT }}

      # Load the MSVC toolchain env (cl/link + INCLUDE/LIB) into the job so the
      # inherited-PATH MSYS2 shell below can see it. FFmpeg has no MSVC-native
      # configure — it runs as a POSIX script under bash but compiles with cl.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # path-type: inherit carries the MSVC env into MSYS2 bash. We pull in
      # bash/make/nasm plus the *MinGW* pkgconf (mingw-w64-x86_64-pkgconf) — but
      # no MinGW gcc. The MinGW pkgconf is a native-Windows build that emits
      # Windows -I/-L paths cl.exe/link.exe can read; the MSYS cygwin pkgconf
      # emits POSIX /d/a/... paths the MSVC toolchain can't use (see makefile.msvc
      # PKG_CONFIG note). Rust + cl come from the runner.
      # VERIFY: path-type inherit can mangle Windows-style INCLUDE/LIB inside
      # MSYS2; this is the most likely thing to need adjustment.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          path-type: inherit
          install: >-
            make git patch diffutils nasm pkgconf mingw-w64-x86_64-pkgconf

      - name: Ensure Rust MSVC target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: FFmpeg submodule revision
        id: ff
        run: echo "sha=$(git -C ffmpeg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache built FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            ffmpeg/FFmpeg-8.0
            ffmpeg/FFmpeg-8.0-custom
          key: windows-msvc-ffmpeg-${{ steps.ff.outputs.sha }}-${{ hashFiles('makefile.msvc') }}

      - name: check-env
        run: make -f makefile.msvc check-env

      - name: make install
        run: make -f makefile.msvc install

      - name: make setup_ffmpeg
        run: make -f makefile.msvc setup_ffmpeg

      - name: make build
        run: make -f makefile.msvc build

      - name: make build_tools
        run: make -f makefile.msvc build_tools

      - name: make test
        run: make -f makefile.msvc test

      - name: make benchmark
        run: make -f makefile.msvc benchmark STEPS=2 STREAMS=2 NRUNS=1
