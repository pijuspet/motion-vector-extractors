[package]
name = "mv-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
mv-types = { path = "../mv-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "histogram", "ab_glyph"] }
plotters-bitmap = "0.3"
ppt-rs = "0.2"
build_html = "2.7.0"
chrono = "0.4"
libc = "0.2"
minijinja = "2"
inferno = "0.12"

[lib]
name = "mv_bench"
path = "lib.rs"

[[bin]]
name = "full_benchmark"
path = "full_benchmark_runner.rs"
